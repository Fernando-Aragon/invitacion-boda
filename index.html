<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
  <title>Invitación de Boda - Cecy & Felipe</title>
  
  <link rel="preload" as="image" href="fondo_celular.jpg" media="(max-width: 767px)">
  <link rel="preload" as="image" href="fondo_escritorio.jpg" media="(min-width: 768px)">
  
  <style>
    :root {
      --olive-body: #617d26;
      --olive-flap: #4e641e;
      --olive-dark: #374615;
      --gold-seal: #d4af37;
      --gold-dark: #9e7d1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1614;
      font-family: 'Playfair Display', Georgia, serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      perspective: 1200px;
    }

    /* =========================================
       1. FONDO FOTOGRÁFICO
       ========================================= */
    .bg-cinematic {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url('fondo_celular.jpg') center center / cover no-repeat;
      filter: brightness(0.92) contrast(1.05);
      z-index: 1;
      opacity: 0;
      transition: opacity 0.8s ease;
      transform: translateZ(0);
    }

    .ready .bg-cinematic {
      opacity: 1;
      animation: cameraGlide 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (min-width: 768px) {
      .bg-cinematic { background-image: url('fondo_escritorio.jpg'); }
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(10,5,2,0.45) 100%);
      pointer-events: none;
      z-index: 2;
    }

    @keyframes cameraGlide {
      0% { transform: scale(1.03); filter: brightness(0.8) blur(2px); }
      100% { transform: scale(1); filter: brightness(0.92) blur(0px); }
    }

    /* =========================================
       2. CONTENEDOR 3D DEL SOBRE
       ========================================= */
    .envelope-stage {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      opacity: 0;
      transform: translateZ(0);
    }

    .ready .envelope-stage {
      animation: dramaticEntry 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (max-width: 360px) {
      .ready .envelope-stage { transform: scale(0.86); }
    }

    @keyframes dramaticEntry {
      0% { transform: translateY(150px) translateZ(-800px) rotateY(-720deg) scale(0.3); opacity: 0; filter: blur(10px); }
      60% { transform: translateY(-10px) translateZ(50px) rotateY(0deg) scale(1.05); opacity: 1; filter: blur(0); }
      100% { transform: translateY(0) translateZ(0) rotateY(0deg) scale(1); opacity: 1; }
    }

    .scene {
      position: relative;
      width: 340px;
      height: 230px;
      transform-style: preserve-3d;
    }

    .scene::after {
      content: '';
      position: absolute;
      bottom: -32px;
      left: 6%;
      width: 88%;
      height: 40px;
      background: radial-gradient(ellipse at center, rgba(12, 7, 3, 0.75) 0%, rgba(12, 7, 3, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .envelope {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transform: rotateX(8deg) rotateZ(-1deg);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .intro-done .envelope:not(.opened) {
      animation: envelopeBreath 3s infinite ease-in-out;
    }

    @keyframes envelopeBreath {
      0%, 100% { transform: rotateX(8deg) rotateZ(-1deg) translateY(0); }
      50% { transform: rotateX(6deg) rotateZ(-1deg) translateY(-8px); }
    }

    .envelope.opened {
      animation: none !important;
      transform: rotateX(0deg) rotateZ(0deg) translateY(0) !important;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--olive-dark) 0%, #293510 100%);
      border-radius: 8px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
      z-index: 1;
    }

    /* =========================================
       3. COREOGRAFÍA Y CARTA
       ========================================= */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-top: 125px solid var(--olive-flap);
      transform-origin: top center;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.4s;
      z-index: 5;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
    }

    .envelope.opened .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 310px;
      height: 205px;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 -2px 14px rgba(0,0,0,0.3);
      z-index: 2;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s, z-index 0s 0.5s;
      pointer-events: none;
    }

    .envelope-letter img { width: 100%; display: block; }

    .envelope.opened .envelope-letter {
      transform: translateY(-150px) translateZ(50px);
      z-index: 10;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid var(--olive-body);
      border-right: 170px solid var(--olive-body);
      border-top: 115px solid transparent;
      border-bottom: 115px solid var(--olive-body);
      border-radius: 0 0 8px 8px;
      z-index: 3;
      filter: drop-shadow(0 -3px 6px rgba(0,0,0,0.25));
    }

    /* =========================================
       4. SELLO PERSONALIZADO (SIN SOMBRA Y CON ZOOM)
       ========================================= */
    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      width: 85px;
      height: 85px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      /* Mantenemos la transición suave para el nuevo efecto */
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-style: preserve-3d;
    }

    .wax-seal img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .envelope.opened .wax-seal {
      /* En lugar de hacerse pequeño, ahora crece y salta hacia el usuario */
      opacity: 0 !important;
      transform: translate(-50%, -50%) scale(1.8) translateZ(80px);
    }

    .open-tag {
      margin-top: 30px;
      background: rgba(18, 12, 8, 0.88);
      border: 1.5px solid var(--gold-seal);
      color: #f7e7c4;
      padding: 10px 26px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease 0.2s, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s, background 0.3s;
    }

    .open-tag:hover { background: rgba(32, 22, 14, 0.95); border-color: #ffd966; }
    .intro-done .open-tag { opacity: 1; transform: translateY(0); }
    .envelope.opened ~ .open-tag, .is-opened-tag { opacity: 0 !important; pointer-events: none; transition: opacity 0.3s ease; }

    /* =========================================
       5. PARTÍCULAS
       ========================================= */
    .particle-wind {
      position: fixed;
      pointer-events: none;
      z-index: 4;
      border-radius: 50%;
      opacity: 0;
      will-change: transform, opacity;
      transform: translateZ(0);
      animation: windBlow linear forwards;
    }

    @keyframes windBlow {
      0% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate3d(var(--dest-x), var(--dest-y), 0) scale(0.2) rotate(var(--rot)); }
    }

    .particle-idle {
      position: fixed;
      pointer-events: none;
      z-index: 4;
      border-radius: 50%;
      background-color: #ffe17d;
      box-shadow: 0 0 12px 2px rgba(255, 225, 125, 0.8);
      opacity: 0;
      will-change: transform, opacity;
      transform: translateZ(0);
      animation: windCross linear forwards;
    }

    @keyframes windCross {
      0% { transform: translate3d(0, 0, 0) scale(0.5); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate3d(-120vw, var(--y-offset), 0) scale(1.2); opacity: 0; }
    }

    /* =========================================
       6. CAPA FULLSCREEN
       ========================================= */
    #fullscreen-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(10, 7, 5, 0);
      visibility: hidden;
      pointer-events: none;
      transition: background 0.6s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    #fullscreen-layer.active {
      visibility: visible;
      pointer-events: auto;
      background: rgba(10, 7, 5, 0.94);
    }

    .close-btn-ios {
      position: fixed;
      top: max(18px, env(safe-area-inset-top) + 12px);
      right: max(18px, env(safe-area-inset-right) + 12px);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(40, 30, 22, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10001;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      transition: opacity 0.35s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s;
    }

    #fullscreen-layer.active .close-btn-ios { opacity: 1; pointer-events: auto; transform: scale(1); }
    .close-btn-ios:hover { background: rgba(65, 48, 32, 0.88); transform: scale(1.08); }
    .close-btn-ios:active { transform: scale(0.92); }
    .close-btn-ios svg { width: 18px; height: 18px; stroke: #f7e7c4; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    #card-viewport {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      justify-content: center;
      padding: 30px 10px;
      touch-action: pan-y pinch-zoom;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 175, 55, 0.35) transparent;
    }

    #card-viewport::-webkit-scrollbar { width: 6px; }
    #card-viewport::-webkit-scrollbar-track { background: transparent; }
    #card-viewport::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.35); border-radius: 10px; }

    #zoom-card {
      position: absolute;
      will-change: transform, width, height, top, left;
      border-radius: 8px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.65);
      transform-origin: center top;
      background: #fff;
    }

    #zoom-card img { width: 100%; height: auto; display: block; pointer-events: none; }
  </style>
</head>
<body>

  <audio id="snd-flap" src="sobre.mp3" preload="metadata"></audio>
  <audio id="snd-music" src="musica.mp3" preload="metadata"></audio>
  <audio id="snd-ambiente" src="viento_ambiente.mp3" preload="metadata"></audio>

  <div class="bg-cinematic"></div>
  <div class="bg-vignette"></div>

  <div class="envelope-stage">
    <div class="scene">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        
        <div class="envelope-letter" id="inner-letter">
          <img src="invitacion.jpg" alt="Invitación de Boda" decoding="async">
        </div>

        <div class="envelope-pocket"></div>
        <div class="envelope-flap"></div>

        <div class="wax-seal">
          <img src="sello.png" alt="Sello de lacre" decoding="async">
        </div>
      </div>
    </div>

    <div class="open-tag" id="open-btn">Toca para abrir</div>
  </div>

  <div id="fullscreen-layer">
    <button class="close-btn-ios" id="close-btn" aria-label="Cerrar invitación">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div id="card-viewport">
      <div id="zoom-card">
        <img src="" alt="Invitación Pantalla Completa">
      </div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const innerLetter = document.getElementById('inner-letter');
    const openBtn = document.getElementById('open-btn');
    const closeBtn = document.getElementById('close-btn');
    const fsLayer = document.getElementById('fullscreen-layer');
    const cardViewport = document.getElementById('card-viewport');
    const zoomCard = document.getElementById('zoom-card');
    const zoomCardImg = zoomCard.querySelector('img');

    const sndFlap = document.getElementById('snd-flap');
    const sndMusic = document.getElementById('snd-music');
    const sndAmbiente = document.getElementById('snd-ambiente');

    let isOpen = false;
    let isTransitioning = false;
    let autoScrollRafId = null;
    let autoScrollCancelled = false;
    
    let idleParticlesInterval = null;
    let activeParticles = [];

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.body.classList.add('ready');
        startIdleParticles();
      }, 100);
    });

    setTimeout(() => {
      document.body.classList.add('intro-done');
    }, 2600);

    function playAudio(audio) {
      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch(err => console.log('Autoplay prevenido:', err));
    }

    function startIdleParticles() {
      if (idleParticlesInterval) clearInterval(idleParticlesInterval);
      
      idleParticlesInterval = setInterval(() => {
        if (isOpen || isTransitioning) return;

        const p = document.createElement('div');
        p.classList.add('particle-idle');
        
        const size = Math.random() * 6 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        
        p.style.left = `105vw`; 
        p.style.top = `${Math.random() * 100}vh`;
        
        const duration = Math.random() * 3 + 4;
        const yOffset = (Math.random() * 200 - 100); 
        
        p.style.setProperty('--y-offset', `${yOffset}px`);
        p.style.animationDuration = `${duration}s`;
        
        document.body.appendChild(p);
        activeParticles.push(p);
        
        setTimeout(() => {
          p.remove();
          activeParticles = activeParticles.filter(item => item !== p);
        }, duration * 1000);
      }, 400); 
    }

    function stopIdleParticles() {
      if (idleParticlesInterval) {
        clearInterval(idleParticlesInterval);
        idleParticlesInterval = null;
      }
      activeParticles.forEach(p => p.remove());
      activeParticles = [];
    }

    function createWindParticles() {
      const colors = ['#d4af37', '#617d26', '#ffe17d', '#ffffff'];
      const numParticles = 80;

      for (let i = 0; i < numParticles; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle-wind');
        
        const size = Math.random() * 10 + 6;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        particle.style.left = '50%';
        particle.style.top = '50%';
        
        const angle = Math.random() * Math.PI * 2; 
        const distance = Math.random() * window.innerWidth * 0.9 + 150;
        const destX = Math.cos(angle) * distance;
        const destY = Math.sin(angle) * distance;
        
        const rotation = Math.random() * 720 - 360;
        const duration = Math.random() * 1.5 + 1.5;
        
        particle.style.setProperty('--dest-x', `${destX}px`);
        particle.style.setProperty('--dest-y', `${destY}px`);
        particle.style.setProperty('--rot', `${rotation}deg`);
        particle.style.animationDuration = `${duration}s`;
        
        document.body.appendChild(particle);
        
        setTimeout(() => { particle.remove(); }, duration * 1000);
      }
    }

    [envelope, openBtn].forEach(el => {
      el.addEventListener('click', () => {
        if (isOpen || isTransitioning) return;
        openInvitation();
      });
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeInvitation();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isOpen && !isTransitioning) closeInvitation();
    });

    function openInvitation() {
      isTransitioning = true;
      
      zoomCardImg.src = 'invitacion.jpg'; 

      envelope.classList.add('opened');
      openBtn.classList.add('is-opened-tag');

      playAudio(sndFlap);
      playAudio(sndMusic);
      if (sndAmbiente) playAudio(sndAmbiente); 
      
      createWindParticles(); 

      setTimeout(() => {
        stopIdleParticles();

        const startRect = innerLetter.getBoundingClientRect();
        
        // AQUI ESTÁ EL ZOOM INICIAL DEL 115% AL ENTRAR EN PANTALLA COMPLETA
        const targetWidth = Math.min(window.innerWidth * 1.15, 700); 
        
        const ratio = startRect.width / startRect.height;
        const targetHeight = targetWidth / ratio;
        const targetLeft = (window.innerWidth - targetWidth) / 2;
        const targetTop = 25; 

        zoomCard.style.transition = 'none';
        zoomCard.style.position = 'fixed';
        zoomCard.style.top = `${startRect.top}px`;
        zoomCard.style.left = `${startRect.left}px`;
        zoomCard.style.width = `${startRect.width}px`;
        zoomCard.style.height = `${startRect.height}px`;

        fsLayer.classList.add('active');
        innerLetter.style.visibility = 'hidden';

        zoomCard.getBoundingClientRect();

        zoomCard.style.transition = 'all 0.85s cubic-bezier(0.16, 1, 0.3, 1)';
        zoomCard.style.top = `${targetTop}px`;
        zoomCard.style.left = `${targetLeft}px`;
        zoomCard.style.width = `${targetWidth}px`;
        zoomCard.style.height = `${targetHeight}px`;

        setTimeout(() => {
          zoomCard.style.position = 'relative';
          zoomCard.style.top = '0';
          zoomCard.style.left = '0';
          zoomCard.style.width = `${targetWidth}px`;
          zoomCard.style.height = 'auto';
          zoomCard.style.transition = 'none';

          isOpen = true;
          isTransitioning = false;

          startAutoScroll(15000);
        }, 850);

      }, 2100);
    }

    function closeInvitation() {
      if (!isOpen || isTransitioning) return;
      isTransitioning = true;
      cancelAutoScroll();

      playAudio(sndFlap);
      if (sndMusic) {
        sndMusic.pause();
        sndMusic.currentTime = 0;
      }

      const currentRect = zoomCard.getBoundingClientRect();
      const targetRect = innerLetter.getBoundingClientRect();

      zoomCard.style.position = 'fixed';
      zoomCard.style.top = `${currentRect.top}px`;
      zoomCard.style.left = `${currentRect.left}px`;
      zoomCard.style.width = `${currentRect.width}px`;
      zoomCard.style.height = `${currentRect.height}px`;

      fsLayer.classList.remove('active');

      zoomCard.getBoundingClientRect();

      zoomCard.style.transition = 'all 0.75s cubic-bezier(0.4, 0, 0.2, 1)';
      zoomCard.style.top = `${targetRect.top}px`;
      zoomCard.style.left = `${targetRect.left}px`;
      zoomCard.style.width = `${targetRect.width}px`;
      zoomCard.style.height = `${targetRect.height}px`;

      setTimeout(() => {
        innerLetter.style.visibility = 'visible';
        zoomCard.removeAttribute('style');

        envelope.classList.remove('opened');
        openBtn.classList.remove('is-opened-tag');

        setTimeout(() => {
          isOpen = false;
          isTransitioning = false;
          cardViewport.scrollTop = 0;
          
          startIdleParticles();
        }, 750);

      }, 750);
    }

    function startAutoScroll(durationMs) {
      autoScrollCancelled = false;
      const maxScroll = cardViewport.scrollHeight - cardViewport.clientHeight;
      if (maxScroll <= 0) return;

      const startTime = performance.now();
      const startScrollTop = cardViewport.scrollTop;

      function step(currentTime) {
        if (autoScrollCancelled) return;
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / durationMs, 1);
        cardViewport.scrollTop = startScrollTop + (maxScroll * progress);
        if (progress < 1) autoScrollRafId = requestAnimationFrame(step);
      }
      autoScrollRafId = requestAnimationFrame(step);
    }

    function cancelAutoScroll() {
      if (!autoScrollCancelled) {
        autoScrollCancelled = true;
        if (autoScrollRafId) cancelAnimationFrame(autoScrollRafId);
      }
    }

    ['touchstart', 'mousedown', 'wheel', 'pointerdown'].forEach(evt => {
      cardViewport.addEventListener(evt, cancelAutoScroll, { passive: true });
    });

    let touchStartY = 0;
    let touchStartX = 0;

    cardViewport.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    cardViewport.addEventListener('touchend', (e) => {
      const deltaY = touchStartY - e.touches[0].clientY;
      const deltaX = Math.abs(touchStartX - e.touches[0].clientX);
      if (deltaY > 80 && deltaY > deltaX) closeInvitation();
    }, { passive: true });
  </script>
</body>
</html>
