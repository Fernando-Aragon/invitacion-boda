<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta property="og:title" content="Cecy & Felipe - Invitación de Boda">
  <meta property="og:description" content="Nos hace muchísima ilusión invitarte. Toca para abrir nuestra invitación.">
  <meta property="og:image" content="https://fernando-aragon.github.io/invitacion-boda/preview.jpg">
  <meta property="og:url" content="https://fernando-aragon.github.io/invitacion-boda/">
  <meta property="og:type" content="website">
  
  <title>Invitación de Boda - Cecy & Felipe</title>
  
  <link rel="preload" as="image" href="fondo_celular.jpg" media="(max-width: 767px)">
  <link rel="preload" as="image" href="fondo_escritorio.jpg" media="(min-width: 768px)">
  
  <style>
    :root {
      --olive-body: #617d26;
      --olive-flap: #4e641e;
      --olive-dark: #374615;
      --gold-seal: #d4af37;
      --gold-dark: #9e7d1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1614;
      font-family: 'Playfair Display', Georgia, serif;
      height: 100vh; height: 100dvh;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      user-select: none; -webkit-tap-highlight-color: transparent;
      perspective: 1200px;
    }

    #fx-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; }

    .bg-cinematic {
      position: fixed; inset: 0; width: 100%; height: 100%;
      background: url('fondo_celular.jpg') center center / cover no-repeat;
      filter: brightness(0.92) contrast(1.05);
      z-index: 1; opacity: 0; transition: opacity 0.8s ease;
      transform: translateZ(0);
    }
    .ready .bg-cinematic { opacity: 1; animation: cameraGlide 3s cubic-bezier(0.16,1,0.3,1) forwards; }
    @media (min-width: 768px) { .bg-cinematic { background-image: url('fondo_escritorio.jpg'); } }
    
    .bg-vignette {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(10,5,2,0.45) 100%);
      pointer-events: none; z-index: 2;
    }
    
    @keyframes cameraGlide { 0% { transform: scale(1.03); } 100% { transform: scale(1); } }

    .envelope-stage {
      position: relative; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transform-style: preserve-3d; opacity: 0; transform: translateZ(0);
    }
    
    .ready .envelope-stage { animation: dramaticEntry 3.5s cubic-bezier(0.16,1,0.3,1) forwards; }
    
    @keyframes dramaticEntry {
      0% { transform: translateY(150px) translateZ(-800px) rotateY(-720deg) scale(0.3); opacity: 0; }
      60% { transform: translateY(-10px) translateZ(50px) rotateY(0deg) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) translateZ(0) rotateY(0deg) scale(1); opacity: 1; }
    }

    .scene { position: relative; width: 340px; height: 230px; transform-style: preserve-3d; }
    
    .scene::after {
      content: ''; position: absolute; bottom: -32px; left: 6%; width: 88%; height: 40px;
      background: radial-gradient(ellipse at center, rgba(12,7,3,0.75) 0%, rgba(12,7,3,0) 70%);
      border-radius: 50%; pointer-events: none; z-index: -1;
    }

    .envelope {
      width: 100%; height: 100%; position: relative;
      cursor: pointer; transform-style: preserve-3d;
      transform: rotateX(8deg) rotateZ(-1deg);
      transition: transform 0.4s cubic-bezier(0.2,0.8,0.3,1);
    }
    
    .intro-done .envelope:not(.flap-open) { animation: envelopeBreath 3s infinite ease-in-out; }

    /* CAPAS DEL SOBRE PRINCIPAL (3D Z-INDEX) */
    .envelope-back {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--olive-dark) 0%, #293510 100%);
      border-radius: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
      transform: translateZ(0);
      transition: transform 2s cubic-bezier(0.2,0.8,0.2,1);
    }

    .envelope-pocket {
      position: absolute; bottom: 0; left: 0; width: 0; height: 0;
      border-left: 170px solid var(--olive-body); border-right: 170px solid var(--olive-body);
      border-top: 115px solid transparent; border-bottom: 115px solid var(--olive-body);
      border-radius: 0 0 8px 8px; 
      transform: translateZ(10px);
      filter: drop-shadow(0 -3px 6px rgba(0,0,0,0.25));
      transition: transform 2s cubic-bezier(0.2,0.8,0.2,1);
    }

    .envelope-flap {
      position: absolute; top: 0; left: 0; width: 0; height: 0;
      border-left: 170px solid transparent; border-right: 170px solid transparent;
      border-top: 125px solid var(--olive-flap);
      transform-origin: top center;
      transform: translateZ(15px);
      transition: transform 0.9s cubic-bezier(0.4,0,0.2,1), z-index 0s 0.45s;
      z-index: 5; 
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
    }
    
    .envelope.flap-open .envelope-flap { 
      transform: translateZ(15px) rotateX(180deg); 
      z-index: 1; 
    }

    .wax-seal {
      position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%,-50%) translateZ(20px);
      z-index: 6; width: 42px; height: 42px;
      display: flex; justify-content: center; align-items: center;
      pointer-events: none; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
    }
    .wax-seal img { width: 100%; height: 100%; object-fit: contain; }
    
    .envelope.flap-open .wax-seal { 
      opacity: 0 !important; 
      transform: translate(-50%,-50%) scale(1.8) translateZ(80px); 
    }

    /* EL CONTENIDO INTERNO (ENTRE EL FONDO Y EL BOLSILLO) */
    .content-wrapper {
      position: absolute;
      top: 50%; left: 50%;
      width: 220px; height: 320px; 
      transform-style: preserve-3d;
      transform-origin: center center;
      transform: translate(-50%, -50%) rotate(90deg) translateZ(5px) scale(0.9);
      opacity: 1; 
      z-index: 2;
      transition: transform 1.5s cubic-bezier(0.2,0.8,0.2,1);
    }

    .envelope.window-open .content-wrapper {
      transform: translate(-50%, -50%) rotate(90deg) translateX(-140px) translateZ(30px) scale(1);
    }

    .envelope.rotate-vertical .content-wrapper {
      transform: translate(-50%, -50%) rotate(0deg) translateY(-140px) translateZ(30px) scale(1);
    }

    .envelope.window-open .envelope-back { transform: translateY(80px) scale(0.85) translateZ(0); }
    .envelope.window-open .envelope-pocket { transform: translateY(80px) scale(0.85) translateZ(10px); }
    .envelope.window-open .envelope-flap { 
      transform: translateY(80px) scale(0.85) rotateX(180deg) translateZ(15px); 
      transition: transform 2s cubic-bezier(0.2,0.8,0.2,1), z-index 0s; 
    }

    .envelope-letter {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; background: #fff;
      border-radius: 4px; overflow: hidden;
      box-shadow: 0 -2px 14px rgba(0,0,0,0.3);
      z-index: 2; pointer-events: none;
    }
    
    .envelope-letter img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .window-envelope {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transform-style: preserve-3d; pointer-events: none; z-index: 4; 
    }

    .window-door {
      position: absolute; top: 0; width: 50%; height: 100%;
      background-color: rgba(255, 255, 255, 0.15); 
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 255, 255, 0.5); 
      transform-origin: center;
      transition: transform 0.8s cubic-bezier(0.4,0,0.2,1); 
      overflow: hidden;
      background-size: cover;
      background-position: center;
      backface-visibility: visible !important; 
      -webkit-backface-visibility: visible !important;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    
    .window-door.left { left: 0; border-radius: 8px 0 0 8px; transform-origin: left center; background-image: url('sobre_puer_izqu.png'); }
    .window-door.right { right: 0; border-radius: 0 8px 8px 0; transform-origin: right center; background-image: url('sobre_puer_dere.png'); }
    
    .envelope.doors-open .window-door.left { transform: rotateY(-120deg); }
    .envelope.doors-open .window-door.right { transform: rotateY(120deg); }

    .open-tag {
      margin-top: 30px; background: rgba(18,12,8,0.88); border: 1.5px solid var(--gold-seal);
      color: #f7e7c4; padding: 10px 26px; border-radius: 25px;
      font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      cursor: pointer; opacity: 0; transform: translateY(10px);
      transition: opacity 1s ease 0.2s, transform 0.6s cubic-bezier(0.2,0.8,0.2,1) 0.2s;
    }
    
    .intro-done .open-tag { opacity: 1; transform: translateY(0); }
    .envelope.flap-open ~ .open-tag, .is-opened-tag { opacity: 0 !important; pointer-events: none; }

    /* PARTÍCULAS */
    .particle-wind { position: fixed; pointer-events: none; border-radius: 50%; opacity: 0; will-change: transform, opacity; transform: translateZ(0); animation: windBlow linear forwards; }
    @keyframes windBlow { 0% { opacity: 1; transform: translate3d(0,0,0) scale(1); } 100% { opacity: 0; transform: translate3d(var(--dest-x),var(--dest-y),0) scale(0.2); } }
    
    .particle-idle { position: fixed; pointer-events: none; border-radius: 50%; background-color: #ffe17d; box-shadow: 0 0 12px 2px rgba(255,225,125,0.8); opacity: 0; will-change: transform, opacity; transform: translateZ(0); animation: windCross linear forwards; }
    @keyframes windCross { 0% { transform: translate3d(0,0,0) scale(0.5); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate3d(-120vw, var(--y-offset), 0) scale(1.2); opacity: 0; } }

    /* CAPA FULLSCREEN */
    #fullscreen-layer { position: fixed; inset: 0; z-index: 9999; background: rgba(10,7,5,0); visibility: hidden; pointer-events: none; transition: background 0.6s ease; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
    #fullscreen-layer.active { visibility: visible; pointer-events: auto; background: rgba(10,7,5,0.94); }

    .close-btn-ios { 
      position: fixed; top: max(20px, env(safe-area-inset-top) + 15px); right: max(20px, env(safe-area-inset-right) + 15px); 
      width: 44px; height: 44px; border-radius: 50%; background: rgba(40,30,22,0.68); 
      border: 1px solid rgba(255,255,255,0.22); color: #fff; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; backdrop-filter: blur(14px); z-index: 99999; box-shadow: 0 4px 16px rgba(0,0,0,0.45); 
      opacity: 0; pointer-events: none; transform: scale(0.85); transition: opacity 0.35s ease, transform 0.25s; 
    }
    .close-btn-ios.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
    .close-btn-ios svg { width: 18px; height: 18px; stroke: #f7e7c4; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    #card-viewport { width: 100%; height: 100%; overflow-y: auto; overflow-x: auto; -webkit-overflow-scrolling: touch; display: block; padding: 30px 10px; touch-action: pan-x pan-y pinch-zoom; scrollbar-width: none; cursor: grab; }
    #card-viewport::-webkit-scrollbar { display: none; }
    
    #zoom-card { position: absolute; will-change: transform, width, height, top, left; transform: translateZ(0); border-radius: 8px; box-shadow: 0 15px 50px rgba(0,0,0,0.65); transform-origin: center top; background: #fff; margin: 0 auto; }
    #zoom-card img { width: 100%; height: auto; display: block; pointer-events: none; }
  </style>
</head>
<body>

  <div id="fx-layer"></div>

  <!-- AUDIOS -->
  <audio id="snd-flap" src="sobre.mp3" preload="metadata"></audio>
  <audio id="snd-music" src="musica.mp3" preload="metadata"></audio>
  <audio id="snd-ambiente" src="viento_ambiente.mp3" preload="metadata"></audio>

  <!-- FONDO -->
  <div class="bg-cinematic"></div>
  <div class="bg-vignette"></div>

  <!-- ESCENARIO DEL SOBRE -->
  <div class="envelope-stage">
    <div class="scene">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        
        <div class="content-wrapper" id="content-wrapper">
          <div class="window-envelope">
            <div class="window-door left" id="door-left"></div>
            <div class="window-door right" id="door-right"></div>
          </div>
          <div class="envelope-letter" id="inner-letter">
            <img src="invitacion.jpg" alt="Invitación">
          </div>
        </div>

        <div class="envelope-pocket"></div>
        <div class="envelope-flap" id="flap"></div>
        <div class="wax-seal"><img src="sello.png" alt="Sello"></div>
      </div>
    </div>
    <div class="open-tag" id="open-btn">Toca para abrir</div>
  </div>

  <!-- BOTÓN CERRAR -->
  <button class="close-btn-ios" id="close-btn">
    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </button>

  <!-- VISOR PANTALLA COMPLETA -->
  <div id="fullscreen-layer">
    <div id="card-viewport">
      <div id="zoom-card"><img src="" alt="Invitación Completa"></div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const innerLetter = document.getElementById('inner-letter');
    const openBtn = document.getElementById('open-btn');
    const closeBtn = document.getElementById('close-btn');
    const fsLayer = document.getElementById('fullscreen-layer');
    const cardViewport = document.getElementById('card-viewport');
    const zoomCard = document.getElementById('zoom-card');
    const zoomCardImg = zoomCard.querySelector('img');
    const fxLayer = document.getElementById('fx-layer');

    const sndFlap = document.getElementById('snd-flap');
    const sndMusic = document.getElementById('snd-music');
    const sndAmbiente = document.getElementById('snd-ambiente');

    let isOpen = false;
    let isTransitioning = false;
    let autoScrollRafId = null;
    let autoScrollTimeoutId = null;
    let autoScrollCancelled = false;
    let currentScale = 1;
    let baseTargetWidth = 0;
    let savedTargetRect = null;
    let idleParticlesInterval = null;
    let activeParticles = [];

    // Inicio de la página
    window.addEventListener('load', () => {
      setTimeout(() => { document.body.classList.add('ready'); startIdleParticles(); }, 100);
    });
    setTimeout(() => { document.body.classList.add('intro-done'); }, 2600);

    // Abrir invitación
    function openInvitation() {
      if (isOpen || isTransitioning) return;
      isTransitioning = true;
      
      zoomCardImg.src = 'invitacion.jpg';
      closeBtn.classList.add('visible');
      playAudio(sndFlap);
      playAudio(sndMusic);
      if (sndAmbiente) playAudio(sndAmbiente);
      createWindParticles();

      envelope.classList.add('flap-open');
      openBtn.classList.add('is-opened-tag');

      // Secuencia de Animación Automática
      setTimeout(() => { envelope.classList.add('window-open'); }, 900);
      setTimeout(() => { envelope.classList.add('rotate-vertical'); }, 2400);
      setTimeout(() => { envelope.classList.add('doors-open'); }, 3600);
      setTimeout(() => { triggerZoom(); }, 4400);
    }

    // Hacer Zoom a Pantalla Completa
    function triggerZoom() {
      savedTargetRect = innerLetter.getBoundingClientRect();
      const startRect = savedTargetRect;
      const isMobile = window.innerWidth < 768;
      const zoomMultiplier = isMobile ? 1.10 : 1.28;
      baseTargetWidth = Math.min(window.innerWidth * zoomMultiplier, isMobile ? 900 : 1200);
      const ratio = startRect.width / startRect.height;
      const targetHeight = baseTargetWidth / ratio;
      const targetLeft = (window.innerWidth - baseTargetWidth) / 2;
      const targetTop = 25;

      zoomCard.style.transition = 'none';
      zoomCard.style.position = 'fixed';
      zoomCard.style.top = `${startRect.top}px`;
      zoomCard.style.left = `${startRect.left}px`;
      zoomCard.style.width = `${startRect.width}px`;
      zoomCard.style.height = `${startRect.height}px`;

      fsLayer.classList.add('active');
      innerLetter.style.visibility = 'hidden';
      zoomCard.getBoundingClientRect(); 

      // Zoom a 1.5s
      zoomCard.style.transition = 'all 1.5s cubic-bezier(0.16,1,0.3,1)';
      zoomCard.style.top = `${targetTop}px`;
      zoomCard.style.left = `${targetLeft}px`;
      zoomCard.style.width = `${baseTargetWidth}px`;
      zoomCard.style.height = `${targetHeight}px`;

      setTimeout(() => {
        zoomCard.style.position = 'relative';
        zoomCard.style.top = '0';
        zoomCard.style.left = '0';
        zoomCard.style.width = `${baseTargetWidth}px`;
        zoomCard.style.height = 'auto';
        zoomCard.style.transition = 'none';
        
        if (baseTargetWidth > cardViewport.clientWidth) {
          cardViewport.scrollLeft = (baseTargetWidth - cardViewport.clientWidth) / 2;
        } else {
          cardViewport.scrollLeft = 0;
        }
        
        isOpen = true;
        isTransitioning = false;
        
        // Retraso de 3 segundos para iniciar autoscroll
        autoScrollTimeoutId = setTimeout(() => {
          if (!autoScrollCancelled) startAutoScroll(19800);
        }, 3000);
      }, 1500); 
    }

    // Cerrar Invitación
    function closeInvitation() {
      if (!isOpen || isTransitioning) return;
      isTransitioning = true;
      
      if (autoScrollTimeoutId) clearTimeout(autoScrollTimeoutId);
      cancelAutoScroll();
      
      closeBtn.classList.remove('visible');
      playAudio(sndFlap);
      if (sndMusic) { sndMusic.pause(); sndMusic.currentTime = 0; }

      const currentRect = zoomCard.getBoundingClientRect();
      const targetRect = savedTargetRect || innerLetter.getBoundingClientRect();

      zoomCard.style.position = 'fixed';
      zoomCard.style.top = `${currentRect.top}px`;
      zoomCard.style.left = `${currentRect.left}px`;
      zoomCard.style.width = `${baseTargetWidth}px`;
      zoomCard.style.height = `${zoomCard.offsetHeight}px`;
      zoomCard.style.transform = `scale(${currentScale})`;

      fsLayer.classList.remove('active');
      zoomCard.getBoundingClientRect();

      zoomCard.style.transition = 'all 0.75s cubic-bezier(0.4,0,0.2,1)';
      zoomCard.style.transform = 'scale(1)';
      zoomCard.style.top = `${targetRect.top}px`;
      zoomCard.style.left = `${targetRect.left}px`;
      zoomCard.style.width = `${targetRect.width}px`;
      zoomCard.style.height = `${targetRect.height}px`;

      setTimeout(() => {
        zoomCard.style.display = 'none';
        innerLetter.style.visibility = 'visible';
        zoomCard.removeAttribute('style');

        setTimeout(() => {
          // Revertir secuencia de cierre
          envelope.classList.remove('doors-open');
          setTimeout(() => { envelope.classList.remove('rotate-vertical'); }, 400);
          setTimeout(() => { envelope.classList.remove('window-open'); }, 1600);
          setTimeout(() => { 
            envelope.classList.remove('flap-open'); 
            openBtn.classList.remove('is-opened-tag');
          }, 3600);

          setTimeout(() => {
            zoomCard.style.display = 'block';
            isOpen = false;
            isTransitioning = false;
            cardViewport.scrollTop = 0;
            cardViewport.scrollLeft = 0;
            currentScale = 1;
            startIdleParticles();
          }, 4000);
        }, 300);
      }, 750);
    }

    // EVENTOS Y UTILIDADES
    function playAudio(audio) { if (!audio) return; audio.currentTime = 0; audio.play().catch(e => console.log('Audio bloqueado')); }
    
    function startIdleParticles() {
      if (idleParticlesInterval) clearInterval(idleParticlesInterval);
      idleParticlesInterval = setInterval(() => {
        if (isOpen || isTransitioning) return;
        const p = document.createElement('div'); p.classList.add('particle-idle');
        const size = Math.random() * 6 + 4; p.style.width = `${size}px`; p.style.height = `${size}px`;
        p.style.left = `105vw`; p.style.top = `${Math.random() * 100}vh`;
        const duration = Math.random() * 3 + 4; const yOffset = (Math.random() * 200 - 100);
        p.style.setProperty('--y-offset', `${yOffset}px`); p.style.animationDuration = `${duration}s`;
        fxLayer.appendChild(p); activeParticles.push(p);
        setTimeout(() => { p.remove(); activeParticles = activeParticles.filter(item => item !== p); }, duration * 1000);
      }, 400);
    }

    function createWindParticles() {
      const colors = ['#ffd700', '#a2d149', '#fffacd', '#ffffff'];
      for (let i = 0; i < 80; i++) {
        const p = document.createElement('div'); p.classList.add('particle-wind');
        const size = Math.random() * 10 + 6; p.style.width = `${size}px`; p.style.height = `${size}px`;
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.boxShadow = `0 0 15px 2px ${colors[Math.floor(Math.random() * colors.length)]}`;
        p.style.left = '50%'; p.style.top = '50%';
        const angle = Math.random() * Math.PI * 2; const distance = Math.random() * window.innerWidth * 0.9 + 150;
        const destX = Math.cos(angle) * distance; const destY = Math.sin(angle) * distance;
        const rotation = Math.random() * 720 - 360; const duration = Math.random() * 1.5 + 1.5;
        p.style.setProperty('--dest-x', `${destX}px`); p.style.setProperty('--dest-y', `${destY}px`);
        p.style.setProperty('--rot', `${rotation}deg`); p.style.animationDuration = `${duration}s`;
        fxLayer.appendChild(p); setTimeout(() => { p.remove(); }, duration * 1000);
      }
    }

    [envelope, openBtn].forEach(el => el.addEventListener('click', openInvitation));
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeInvitation(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen) closeInvitation(); });

    // CONTROL DE ZOOM Y ARRASTRE
    cardViewport.addEventListener('wheel', (e) => {
      if (!isOpen) return;
      if (e.ctrlKey || window.innerWidth >= 768) {
        e.preventDefault(); const intensity = 0.1;
        currentScale = Math.min(3.5, Math.max(0.5, e.deltaY < 0 ? currentScale + intensity : currentScale - intensity));
        zoomCard.style.transform = `scale(${currentScale})`;
      }
    }, { passive: false });

    let isDragging = false, startX, startY, scrollLeft, scrollTop;
    cardViewport.addEventListener('mousedown', (e) => {
      if (!isOpen) return; isDragging = true;
      startX = e.pageX - cardViewport.offsetLeft; startY = e.pageY - cardViewport.offsetTop;
      scrollLeft = cardViewport.scrollLeft; scrollTop = cardViewport.scrollTop;
    });
    cardViewport.addEventListener('mouseleave', () => isDragging = false);
    cardViewport.addEventListener('mouseup', () => isDragging = false);
    cardViewport.addEventListener('mousemove', (e) => {
      if (!isOpen || !isDragging) return; e.preventDefault();
      cardViewport.scrollLeft = scrollLeft - (e.pageX - cardViewport.offsetLeft - startX);
      cardViewport.scrollTop = scrollTop - (e.pageY - cardViewport.offsetTop - startY);
    });

    let initialPinchDistance = null, initialScale = 1;
    cardViewport.addEventListener('touchstart', (e) => {
      if (!isOpen) return;
      if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialScale = currentScale;
      }
    }, { passive: true });
    cardViewport.addEventListener('touchmove', (e) => {
      if (!isOpen || e.touches.length !== 2 || initialPinchDistance === null) return;
      e.preventDefault();
      const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      currentScale = Math.min(3.5, Math.max(0.5, initialScale * (currentDistance / initialPinchDistance)));
      zoomCard.style.transform = `scale(${currentScale})`;
    }, { passive: false });
    cardViewport.addEventListener('touchend', (e) => { if (e.touches.length < 2) initialPinchDistance = null; }, { passive: true });

    function startAutoScroll(durationMs) {
      autoScrollCancelled = false; const maxScroll = cardViewport.scrollHeight - cardViewport.clientHeight;
      if (maxScroll <= 0) return;
      const startTime = performance.now(); const startScrollTop = cardViewport.scrollTop;
      function step(currentTime) {
        if (autoScrollCancelled) return;
        const progress = Math.min((currentTime - startTime) / durationMs, 1);
        cardViewport.scrollTop = startScrollTop + (maxScroll * progress);
        if (progress < 1) autoScrollRafId = requestAnimationFrame(step);
      }
      autoScrollRafId = requestAnimationFrame(step);
    }
    
    function cancelAutoScroll() {
      if (!autoScrollCancelled) { autoScrollCancelled = true; if (autoScrollRafId) cancelAnimationFrame(autoScrollRafId); }
    }
    
    ['touchstart', 'mousedown', 'wheel', 'pointerdown'].forEach(evt => {
      cardViewport.addEventListener(evt, (e) => { if (!e.ctrlKey) cancelAutoScroll(); }, { passive: true });
    });
  </script>
