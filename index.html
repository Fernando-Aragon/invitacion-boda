<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
  <title>Invitación de Boda - Cecy & Felipe</title>
  <style>
    :root {
      --olive-body: #617d26;
      --olive-flap: #4e641e;
      --olive-dark: #374615;
      --gold-seal: #d4af37;
      --gold-dark: #9e7d1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0a08;
      font-family: 'Playfair Display', Georgia, serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      perspective: 1200px;
    }

    /* =========================================
       1. FONDO FOTOGRÁFICO RESPONSIVO (PC vs CELULAR)
       ========================================= */
    .bg-cinematic {
      position: fixed;
      inset: 0; /* Ocupa exactamente toda la pantalla */
      width: 100%;
      height: 100%;
      /* Por defecto, carga la imagen de celular */
      background: url('fondo_celular.jpg') center center / cover no-repeat;
      filter: brightness(0.92) contrast(1.05);
      z-index: 1;
      /* Animación de entrada suave (sin hacer zoom excesivo) */
      animation: cameraGlide 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Si la pantalla es mayor a 768px (Tablets o PC), carga la de escritorio */
    @media (min-width: 768px) {
      .bg-cinematic {
        background-image: url('fondo_escritorio.jpg');
      }
    }

    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(10,5,2,0.45) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Animación mucho más sutil para no recortar la imagen */
    @keyframes cameraGlide {
      0% { transform: scale(1.03); filter: brightness(0.8) blur(2px); }
      100% { transform: scale(1); filter: brightness(0.92) blur(0px); }
    }

    /* =========================================
       2. CONTENEDOR 3D DEL SOBRE
       ========================================= */
    .envelope-stage {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      animation: envelopeApproach 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.3s ease;
    }

    @media (max-width: 360px) {
      .envelope-stage { transform: scale(0.86); }
    }

    @keyframes envelopeApproach {
      0% { transform: translateZ(-250px) translateY(40px) rotateX(15deg); opacity: 0; }
      100% { transform: translateZ(0) translateY(0) rotateX(0deg); opacity: 1; }
    }

    .scene {
      position: relative;
      width: 340px;
      height: 230px;
      transform-style: preserve-3d;
    }

    .scene::after {
      content: '';
      position: absolute;
      bottom: -32px;
      left: 6%;
      width: 88%;
      height: 40px;
      background: radial-gradient(ellipse at center, rgba(12, 7, 3, 0.75) 0%, rgba(12, 7, 3, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .envelope {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transform: rotateX(8deg) rotateZ(-1deg);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .intro-done .envelope:not(.opened) {
      animation: envelopeBreath 3s infinite ease-in-out;
    }

    @keyframes envelopeBreath {
      0%, 100% { transform: rotateX(8deg) rotateZ(-1deg) translateY(0); }
      50% { transform: rotateX(6deg) rotateZ(-1deg) translateY(-8px); }
    }

    .envelope.opened {
      animation: none !important;
      transform: rotateX(0deg) rotateZ(0deg) translateY(0) !important;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--olive-dark) 0%, #293510 100%);
      border-radius: 8px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
      z-index: 1;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-top: 125px solid var(--olive-flap);
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
    }

    .envelope.opened .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 310px;
      height: 205px;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 -2px 14px rgba(0,0,0,0.3);
      z-index: 2;
      transition: transform 0.85s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }

    .envelope-letter img {
      width: 100%;
      display: block;
    }

    .envelope.opened .envelope-letter {
      transform: translateY(-150px);
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 170px solid var(--olive-body);
      border-right: 170px solid var(--olive-body);
      border-top: 115px solid transparent;
      border-bottom: 115px solid var(--olive-body);
      border-radius: 0 0 8px 8px;
      z-index: 3;
      filter: drop-shadow(0 -3px 6px rgba(0,0,0,0.25));
    }

    /* =========================================
       3. SELLO DE LACRE Y BOTÓN
       ========================================= */
    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffe17d 0%, var(--gold-seal) 50%, var(--gold-dark) 100%);
      box-shadow: 
        0 6px 18px rgba(0,0,0,0.55),
        inset 0 2px 4px rgba(255,255,255,0.7),
        inset 0 -3px 5px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed rgba(255, 240, 180, 0.45);
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.3s ease;
    }

    .wax-seal svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    .envelope.opened .wax-seal {
      opacity: 0 !important;
      transform: translate(-50%, -50%) scale(0.5);
    }

    .open-tag {
      margin-top: 30px;
      background: rgba(18, 12, 8, 0.88);
      border: 1.5px solid var(--gold-seal);
      color: #f7e7c4;
      padding: 10px 26px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.4s ease, background 0.3s;
    }

    .open-tag:hover {
      background: rgba(32, 22, 14, 0.95);
      border-color: #ffd966;
    }

    .intro-done .open-tag {
      opacity: 1;
      transform: translateY(0);
    }

    .envelope.opened ~ .open-tag,
    .is-opened-tag {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* =========================================
       4. CAPA FULLSCREEN & BOTÓN "X" ESTILO IPHONE
       ========================================= */
    #fullscreen-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(10, 7, 5, 0);
      visibility: hidden;
      pointer-events: none;
      transition: background 0.6s ease;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    #fullscreen-layer.active {
      visibility: visible;
      pointer-events: auto;
      background: rgba(10, 7, 5, 0.94);
    }

    .close-btn-ios {
      position: fixed;
      top: max(18px, env(safe-area-inset-top) + 12px);
      right: max(18px, env(safe-area-inset-right) + 12px);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(40, 30, 22, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10001;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
      transition: opacity 0.35s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s;
    }

    #fullscreen-layer.active .close-btn-ios {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .close-btn-ios:hover {
      background: rgba(65, 48, 32, 0.88);
      transform: scale(1.08);
    }

    .close-btn-ios:active {
      transform: scale(0.92);
    }

    .close-btn-ios svg {
      width: 18px;
      height: 18px;
      stroke: #f7e7c4;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #card-viewport {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      justify-content: center;
      padding: 30px 10px;
      touch-action: pan-y pinch-zoom;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 175, 55, 0.35) transparent;
    }

    #card-viewport::-webkit-scrollbar { width: 6px; }
    #card-viewport::-webkit-scrollbar-track { background: transparent; }
    #card-viewport::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.35);
      border-radius: 10px;
    }
    #card-viewport::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.65);
    }

    #zoom-card {
      position: absolute;
      will-change: transform, width, height, top, left;
      border-radius: 8px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.65);
      transform-origin: center top;
      background: #fff;
    }

    #zoom-card img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <audio id="snd-flap" src="sobre.mp3" preload="auto"></audio>
  <audio id="snd-music" src="musica.mp3" preload="auto"></audio>

  <div class="bg-cinematic"></div>
  <div class="bg-vignette"></div>

  <div class="envelope-stage">
    <div class="scene">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        
        <div class="envelope-letter" id="inner-letter">
          <img src="invitacion.png" alt="Invitación de Boda">
        </div>

        <div class="envelope-pocket"></div>
        <div class="envelope-flap"></div>

        <div class="wax-seal">
          <svg viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="open-tag" id="open-btn">Toca para abrir</div>
  </div>

  <div id="fullscreen-layer">
    <button class="close-btn-ios" id="close-btn" aria-label="Cerrar invitación">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div id="card-viewport">
      <div id="zoom-card">
        <img src="invitacion.png" alt="Invitación Pantalla Completa">
      </div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const innerLetter = document.getElementById('inner-letter');
    const openBtn = document.getElementById('open-btn');
    const closeBtn = document.getElementById('close-btn');
    const fsLayer = document.getElementById('fullscreen-layer');
    const cardViewport = document.getElementById('card-viewport');
    const zoomCard = document.getElementById('zoom-card');

    const sndFlap = document.getElementById('snd-flap');
    const sndMusic = document.getElementById('snd-music');

    let isOpen = false;
    let isTransitioning = false;
    let autoScrollRafId = null;
    let autoScrollCancelled = false;

    setTimeout(() => {
      document.body.classList.add('intro-done');
    }, 2800);

    function playAudio(audio) {
      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch(err => console.log('Autoplay prevenido:', err));
    }

    [envelope, openBtn].forEach(el => {
      el.addEventListener('click', () => {
        if (isOpen || isTransitioning) return;
        openInvitation();
      });
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeInvitation();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isOpen && !isTransitioning) {
        closeInvitation();
      }
    });

    function openInvitation() {
      isTransitioning = true;
      envelope.classList.add('opened');
      openBtn.classList.add('is-opened-tag');

      playAudio(sndFlap);
      playAudio(sndMusic);

      setTimeout(() => {
        const startRect = innerLetter.getBoundingClientRect();
        const targetWidth = Math.min(window.innerWidth * 0.94, 500);
        const ratio = startRect.width / startRect.height;
        const targetHeight = targetWidth / ratio;
        const targetLeft = (window.innerWidth - targetWidth) / 2;
        const targetTop = 25; 

        zoomCard.style.transition = 'none';
        zoomCard.style.position = 'fixed';
        zoomCard.style.top = `${startRect.top}px`;
        zoomCard.style.left = `${startRect.left}px`;
        zoomCard.style.width = `${startRect.width}px`;
        zoomCard.style.height = `${startRect.height}px`;

        fsLayer.classList.add('active');
        innerLetter.style.visibility = 'hidden';

        zoomCard.getBoundingClientRect(); // Reflow

        zoomCard.style.transition = 'all 0.85s cubic-bezier(0.16, 1, 0.3, 1)';
        zoomCard.style.top = `${targetTop}px`;
        zoomCard.style.left = `${targetLeft}px`;
        zoomCard.style.width = `${targetWidth}px`;
        zoomCard.style.height = `${targetHeight}px`;

        setTimeout(() => {
          zoomCard.style.position = 'relative';
          zoomCard.style.top = '0';
          zoomCard.style.left = '0';
          zoomCard.style.width = `${targetWidth}px`;
          zoomCard.style.height = 'auto';
          zoomCard.style.transition = 'none';

          isOpen = true;
          isTransitioning = false;

          startAutoScroll(15000);
        }, 850);

      }, 850);
    }

    function startAutoScroll(durationMs) {
      autoScrollCancelled = false;
      const maxScroll = cardViewport.scrollHeight - cardViewport.clientHeight;
      if (maxScroll <= 0) return;

      const startTime = performance.now();
      const startScrollTop = cardViewport.scrollTop;

      function step(currentTime) {
        if (autoScrollCancelled) return;

        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / durationMs, 1);
        
        cardViewport.scrollTop = startScrollTop + (maxScroll * progress);

        if (progress < 1) {
          autoScrollRafId = requestAnimationFrame(step);
        }
      }
      autoScrollRafId = requestAnimationFrame(step);
    }

    function cancelAutoScroll() {
      if (!autoScrollCancelled) {
        autoScrollCancelled = true;
        if (autoScrollRafId) cancelAnimationFrame(autoScrollRafId);
      }
    }

    ['touchstart', 'mousedown', 'wheel', 'pointerdown'].forEach(evt => {
      cardViewport.addEventListener(evt, cancelAutoScroll, { passive: true });
    });

    let touchStartY = 0;
    let touchStartX = 0;

    cardViewport.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    cardViewport.addEventListener('touchend', (e) => {
      const deltaY = touchStartY - e.touches[0].clientY;
      const deltaX = Math.abs(touchStartX - e.touches[0].clientX);

      if (deltaY > 80 && deltaY > deltaX) {
        closeInvitation();
      }
    }, { passive: true });

    function closeInvitation() {
      if (!isOpen || isTransitioning) return;
      isTransitioning = true;
      cancelAutoScroll();

      playAudio(sndFlap);
      if (sndMusic) {
        sndMusic.pause();
        sndMusic.currentTime = 0;
      }

      const currentRect = zoomCard.getBoundingClientRect();
      const targetRect = innerLetter.getBoundingClientRect();

      zoomCard.style.position = 'fixed';
      zoomCard.style.top = `${currentRect.top}px`;
      zoomCard.style.left = `${currentRect.left}px`;
      zoomCard.style.width = `${currentRect.width}px`;
      zoomCard.style.height = `${currentRect.height}px`;

      fsLayer.classList.remove('active');

      zoomCard.getBoundingClientRect(); // Reflow

      zoomCard.style.transition = 'all 0.75s cubic-bezier(0.4, 0, 0.2, 1)';
      zoomCard.style.top = `${targetRect.top}px`;
      zoomCard.style.left = `${targetRect.left}px`;
      zoomCard.style.width = `${targetRect.width}px`;
      zoomCard.style.height = `${targetRect.height}px`;

      setTimeout(() => {
        // LA CORRECCIÓN DEL BUG ESTÁ AQUÍ:
        // Eliminamos el 'fsLayer.style.visibility = hidden' que rompía la reapertura.
        
        innerLetter.style.visibility = 'visible';
        zoomCard.removeAttribute('style');

        envelope.classList.remove('opened');
        openBtn.classList.remove('is-opened-tag');

        setTimeout(() => {
          isOpen = false;
          isTransitioning = false;
          cardViewport.scrollTop = 0;
        }, 750);

      }, 750);
    }
  </script>
</body>
</html>
